[package]
name = "cap-root-core"
description = "Pure lexical admission for capability-relative paths"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
repository = "rad://z3cWBCK7VPbEmbL5MAvKJWKjCE745"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
