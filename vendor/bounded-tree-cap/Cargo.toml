[package]
name = "bounded-tree-cap"
description = "Capability-based filesystem shell for bounded-tree-core"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
repository = "rad:zqhtZvsteJhxCJE96dMAZSZ9y1PX"
rust-version = "1.85.0"
version = "0.1.0"

[dependencies]
blake3 = { version = "=1.8.2", default-features = false, features = ["std"] }
bounded-tree-core = { path = "../bounded-tree-core" }
