[package]
name = "cairn-cob-reference-producer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
git2 = { version = "0.20.4", features = ["vendored-libgit2"], default-features = false }
nonempty = "0.9"
radicle = "0.24.0"
radicle-cob = { version = "0.20.0", features = ["git2", "stable-commit-ids"] }
radicle-crypto = { version = "0.17.0", features = ["ssh"] }
radicle-oid = { version = "=0.2.0", features = ["git2", "serde", "sha1", "std"], default-features = false }
serde_json = "1.0"

[workspace]
