[workspace]
members = [
  "crates/cairn-core",
  "crates/cairn-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/onixresearch/cairn"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.5"
cap-std = "4.0.2"
crossterm = "0.28"
ed25519-dalek = "2.2"
preserves = "4.996.0"
rat-nodegraph = { git = "https://github.com/brittonr/subwayrat.git", rev = "9d68c69f13ad5c4385e8c96ff727bd6a7a1f8dd2" }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.metadata.slotcar]
default_scope = ["--workspace"]
cargo_check_args = ["--all-targets"]
